spring:
  application:
    name: RabbitHome
  # 导入各业务模块的独立配置(不依赖 profile 激活)
  config:
    import:
      - classpath:application-user.yaml
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    # 数据库连接配置
    url: jdbc:mysql://localhost:3306/demo?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: dzf01025817
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    # 在控制台打印生成的真实 SQL 语句，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 配置主键自增策略
      id-type: auto

server:
  port: ${PORT:8082}

# 磁盘目录
user:
  path:
    disk: disk
    file: disk/file
    img: disk/img


# logging配置
logging:
  file:
    name: ./logs/springboot-app.log
  level:
    root: INFO
